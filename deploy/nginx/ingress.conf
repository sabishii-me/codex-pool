map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8989;
    server_name _;
    client_max_body_size 64m;
    set $api_upstream http://api:8989;
    set $web_upstream http://web:8080;

    location = /ingress-healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"ingress"}\n';
    }

    # Exact browser navigation routes go to the independently deployed SPA.
    location = / { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /models { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /usage { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /setup { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /profile { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /admin/connections { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /admin/members { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /admin/system { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location /assets/ { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }

    # Everything else belongs to the API/model gateway, including backend
    # /admin operations, OAuth, setup/config downloads, SSE, and WebSockets.
    location / {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
