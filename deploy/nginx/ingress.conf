map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8989;
    server_name _;
    client_max_body_size 64m;
    set $api_upstream http://api:8989;
    set $web_upstream http://web:8080;

    location = /ingress-healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"ingress"}\n';
    }

    # Exact browser navigation routes go to the independently deployed SPA.
    location = / { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /models { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /usage { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /setup { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /profile { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /admin/connections { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /admin/members { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location = /admin/system { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }
    location /assets/ { proxy_pass $web_upstream; include /etc/nginx/proxy-common.conf; }

    # Management, auth, and health surface (the api gateway's non-model side).
    location = /healthz { proxy_pass $api_upstream; include /etc/nginx/proxy-common.conf; proxy_buffering off; proxy_request_buffering off; }
    location = /status { proxy_pass $api_upstream; include /etc/nginx/proxy-common.conf; proxy_buffering off; proxy_request_buffering off; }
    location /auth/ { proxy_pass $api_upstream; include /etc/nginx/proxy-common.conf; proxy_buffering off; proxy_request_buffering off; }
    # codex apps / MCP endpoints are model surface — internal only, even though
    # they sit under /api/.
    location /api/codex/ { return 403; }
    location /api/ { proxy_pass $api_upstream; include /etc/nginx/proxy-common.conf; proxy_buffering off; proxy_request_buffering off; }
    location /admin/ { proxy_pass $api_upstream; include /etc/nginx/proxy-common.conf; proxy_buffering off; proxy_request_buffering off; }

    # Client configuration download/setup (token-authenticated). These are
    # install instructions for clients, not model API traffic, so they stay
    # reachable through the public/tunnel ingress.
    location /setup/ { proxy_pass $api_upstream; include /etc/nginx/proxy-common.conf; proxy_buffering off; proxy_request_buffering off; }
    location /config/ { proxy_pass $api_upstream; include /etc/nginx/proxy-common.conf; proxy_buffering off; proxy_request_buffering off; }

    # Everything else (model API /v1, /responses, /backend-api, client setup
    # scripts, config downloads, OAuth token refresh, codex apps) is INTERNAL
    # ONLY: it is served by the api direct port (8990) and must never be
    # reachable through this public/tunnel ingress.
    location / { return 403; }
}
