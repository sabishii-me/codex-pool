services:
  codex-pool-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-pool:dev
    ports:
      # Use a different hostname as well as a different port when opening the
      # dashboard. Browser cookies are shared across ports on the same host.
      - "127.0.0.2:18991:8989"
    volumes:
      # Never point these mounts at ./pool or ./data. Provider credentials and
      # all mutable development state must remain independent from production.
      - ./dev/pool:/app/pool
      - ./dev/data:/app/data
      - ./dev/provider-specs:/app/provider-specs
    environment:
      POOL_DIR: /app/pool
      PROVIDER_SPECS_DIR: /app/provider-specs
      PROXY_DB_PATH: /app/data/proxy.db
      POOL_USERS_PATH: /app/data/pool_users.json
      ADMIN_MFA_PATH: /app/data/admin_mfa.json
      CODEX_FINGERPRINT_STATE_PATH: /app/data/codex_fingerprint.json
      PROXY_LISTEN_ADDR: 0.0.0.0:8989
      # DEV_* interpolation names intentionally differ from production names.
      # This prevents Compose's automatic root .env loading from importing live
      # secrets or behavior when --env-file is accidentally omitted.
      PROXY_MAX_ATTEMPTS: ${DEV_PROXY_MAX_ATTEMPTS:-1}
      PROXY_USAGE_REFRESH_SECONDS: ${DEV_PROXY_USAGE_REFRESH_SECONDS:-300}
      # Prevent a copied credential from being refreshed or mutated by default.
      # Set this to false explicitly only when exercising a real dev connection.
      PROXY_DISABLE_REFRESH: ${DEV_PROXY_DISABLE_REFRESH:-true}
      PROXY_DEBUG: ${DEV_PROXY_DEBUG:-false}
      PUBLIC_URL: ${DEV_PUBLIC_URL:-http://127.0.0.2:18991}
      # Serve the current React UI with an isolated synthetic member session.
      # The backend refuses this mode unless PUBLIC_URL and request Host are loopback.
      LOCAL_DEV_SESSION: ${DEV_LOCAL_SESSION:-true}
      FRIEND_NAME: ${DEV_FRIEND_NAME:-Codex Pool Active Development}
      POOL_JWT_SECRET: ${DEV_POOL_JWT_SECRET:-active-development-only-change-before-sharing}
      OAUTH_GOOGLE_CLIENT_ID: ${DEV_OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${DEV_OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_REDIRECT_URI: ${DEV_OAUTH_GOOGLE_REDIRECT_URI:-http://127.0.0.2:18991/auth/callback/google}
      ALLOWED_EMAILS: ${DEV_ALLOWED_EMAILS:-}
      ADMIN_EMAILS: ${DEV_ADMIN_EMAILS:-}
      UPSTREAM_KIMI_PLATFORM_BASE: ${DEV_UPSTREAM_KIMI_PLATFORM_BASE:-https://api.moonshot.ai/anthropic}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8989/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
