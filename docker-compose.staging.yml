services:
  staging-data-permissions:
    image: ${STAGING_IMAGE:?set STAGING_IMAGE to the immutable image promoted from Test}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        chown -R codex:codex /app/data /app/pool /app/provider-specs &&
        chmod 700 /app/data /app/pool /app/provider-specs &&
        find /app/data /app/pool /app/provider-specs -type f -exec chmod 600 {} +
    volumes:
      - ./staging/pool:/app/pool
      - ./staging/data:/app/data
      - ./staging/provider-specs:/app/provider-specs
    restart: "no"

  codex-pool-staging:
    # Staging receives the exact immutable image promoted from Test.
    # The image is explicit so Compose never silently builds or rolls back a release.
    image: ${STAGING_IMAGE:?set STAGING_IMAGE to the immutable image promoted from Test}
    ports:
      - "127.0.0.1:18990:8989"
    volumes:
      - ./staging/pool:/app/pool
      - ./staging/data:/app/data
      - ./staging/provider-specs:/app/provider-specs
    environment:
      POOL_DIR: /app/pool
      PROVIDER_SPECS_DIR: /app/provider-specs
      PROXY_DB_PATH: /app/data/proxy.db
      POOL_USERS_PATH: /app/data/pool_users.json
      ADMIN_MFA_PATH: /app/data/admin_mfa.json
      CODEX_FINGERPRINT_STATE_PATH: /app/data/codex_fingerprint.json
      PROXY_LISTEN_ADDR: 0.0.0.0:8989
      PROXY_MAX_ATTEMPTS: 3
      PROXY_USAGE_REFRESH_SECONDS: 300
      PUBLIC_URL: ${STAGING_PUBLIC_URL:-http://127.0.0.1:18990}
      FRIEND_NAME: ${STAGING_FRIEND_NAME:-Codex Pool Staging}
      POOL_JWT_SECRET: ${STAGING_POOL_JWT_SECRET:-development-only-change-before-sharing}
      OAUTH_GOOGLE_CLIENT_ID: ${STAGING_OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${STAGING_OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_REDIRECT_URI: ${STAGING_OAUTH_GOOGLE_REDIRECT_URI:-http://127.0.0.1:18990/auth/callback/google}
      ALLOWED_EMAILS: ${STAGING_ALLOWED_EMAILS:-}
      ADMIN_EMAILS: ${STAGING_ADMIN_EMAILS:-}
    depends_on:
      staging-data-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8989/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
